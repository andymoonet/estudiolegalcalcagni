# Publica la web en el hosting de IONOS cada vez que hay cambios en main.
# Necesita estos secrets del repo (Settings > Secrets and variables > Actions):
#   FTP_SERVER    servidor FTP de IONOS (por ejemplo, access123456789.webspace-data.io)
#   FTP_USERNAME  usuario FTP/SFTP de IONOS
#   FTP_PASSWORD  contraseña de ese usuario
#   FTP_DIR       (opcional) carpeta del dominio en el webspace, terminada en "/". Por defecto, la raíz "./"
name: Publicar en IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir archivos por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
